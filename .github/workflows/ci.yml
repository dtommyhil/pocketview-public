name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pocketview_ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: pocketview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketview_ci -d pocketview_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Disposable CI database, not a real secret. No Plaid keys or GitHub secrets needed.
      TEST_DATABASE_URL: postgresql://pocketview_ci:disposable-ci-password@127.0.0.1:5432/pocketview_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check pocketview/static/app.js && node --check pocketview/static/charts.js
      - run: node --test tests/link.test.cjs
      - run: pytest -q
