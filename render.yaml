services:
  - type: web
    name: pocketview-demo
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start_demo.sh
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: APP_MODE
        value: demo
      - key: PLAID_ENV
        value: sandbox
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
