name: pocketview
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pocketview
      POSTGRES_USER: pocketview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketview -d pocketview"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
